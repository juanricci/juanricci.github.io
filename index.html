<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>¿Qué hay en casa?</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1F4D38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="¿Qué hay en casa?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F5EF;
    --paper-card: #FFFFFF;
    --ink: #1F2A1F;
    --ink-soft: #55604F;
    --green: #2F6B4F;
    --green-dark: #1F4D38;
    --amber: #B8862B;
    --amber-bg: #FBF1DD;
    --red: #B5432E;
    --line: #D8D4C4;
    --line-dotted: #C9C5B8;
    --shadow: 0 1px 2px rgba(31,42,31,0.06), 0 4px 14px rgba(31,42,31,0.05);
    --toast-bg: var(--green-dark);
    --auto-bg: #E4EFE8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper: #15211A;
      --paper-card: #1E2C22;
      --ink: #EDEDE3;
      --ink-soft: #93A08F;
      --green: #4FA179;
      --green-dark: #9FD9BB;
      --amber: #E0A84D;
      --amber-bg: #3A2F16;
      --red: #E2685A;
      --line: #34423A;
      --line-dotted: #2A362E;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.35);
      --toast-bg: #2E6B4C;
      --auto-bg: #1F3D2C;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}

  header.top{
    padding:28px 16px 16px;
    max-width:640px;
    margin:0 auto;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand h1{
    font-family:'Archivo Black', sans-serif;
    font-size:28px;
    letter-spacing:-0.5px;
    margin:0;
    color:var(--green-dark);
    text-transform:lowercase;
  }
  .brand .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:20px;
    padding:2px 8px;
  }
  button.tag{
    background:var(--paper-card);
    line-height:1;
    font-size:13px;
  }
  button.tag.spin{animation:spin .6s linear;}
  @keyframes spin{ to { transform:rotate(360deg); } }
  .sub{color:var(--ink-soft); font-size:14px; margin-top:4px;}

  nav.tabs{
    display:flex;
    gap:4px;
    margin:20px auto 0;
    max-width:640px;
    padding:0 16px;
  }
  nav.tabs button{
    flex:1;
    font-family:'Public Sans', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:10px 12px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    border-bottom:2px solid var(--line);
    cursor:pointer;
    transition:color .15s;
  }
  nav.tabs button.active{
    color:var(--green-dark);
    border-bottom:2px solid var(--green);
  }

  section.view{display:none; padding-top:18px;}
  section.view.active{display:block;}

  .toolbar{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  select, input[type=text], input[type=number]{
    font-family:'Public Sans', sans-serif;
    font-size:16px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper-card);
    color:var(--ink);
  }
  select{flex:1; min-width:120px;}
  #stockSearch, #listaSearch{flex:1; min-width:120px;}

  button.btn{
    font-family:'Public Sans', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:9px 14px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    background:var(--green);
    color:#fff;
    white-space:nowrap;
  }
  button.btn.secondary{
    background:var(--paper-card);
    color:var(--green-dark);
    border:1px solid var(--line);
  }
  button.btn.ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1px dashed var(--line);
  }
  button.btn:active{transform:translateY(1px);}

  .receipt{
    background:var(--paper-card);
    border-radius:10px;
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:16px;
  }
  .cat-heading{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:10px 14px 4px;
    background:var(--paper-card);
  }
  .row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-bottom:1px dotted var(--line-dotted);
  }
  .row:last-child{border-bottom:none;}
  .row.low{
    background:var(--amber-bg);
  }
  .row.low .name::after{
    content:"bajo mínimo";
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--amber);
    margin-left:8px;
    border:1px solid var(--amber);
    border-radius:20px;
    padding:1px 6px;
  }
  .row .name{
    flex:1;
    font-weight:600;
    font-size:14.5px;
    min-width:0;
  }
  .row .cat-pill{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .qty-controls{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .qty-controls button{
    width:26px;height:26px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    color:var(--green-dark);
    font-weight:700;
  }
  .qty-val{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:14px;
    min-width:44px;
    text-align:center;
  }
  .row .del{
    background:none;border:none;color:var(--line-dotted);cursor:pointer;font-size:16px;padding:2px 4px;
  }
  .row .del:hover{color:var(--red);}

  .check-row{
    display:flex;align-items:center;gap:10px;
  }
  .check-row input[type=checkbox]{
    width:18px;height:18px;accent-color:var(--green);
  }
  .check-row.done .name{
    text-decoration:line-through;
    color:var(--ink-soft);
  }
  .origin-auto{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    color:var(--green-dark);
    background:var(--auto-bg);
    border-radius:20px;
    padding:1px 6px;
    margin-left:6px;
  }

  .empty{
    text-align:center;
    padding:36px 16px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty .icon{font-size:28px; display:block; margin-bottom:8px;}

  /* torn edge signature on the shopping list card */
  .receipt.tear{
    position:relative;
    margin-bottom:26px;
  }
  .receipt.tear::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-9px;
    height:10px;
    background:
      linear-gradient(-45deg, var(--paper) 6px, transparent 0),
      linear-gradient(45deg, var(--paper) 6px, transparent 0);
    background-size:12px 12px;
    background-repeat:repeat-x;
  }

  dialog{
    border:none;
    border-radius:14px;
    padding:0;
    max-width:400px;
    width:90%;
    box-shadow:var(--shadow);
  }
  dialog::backdrop{background:rgba(31,42,31,0.35);}
  .modal{padding:20px;}
  .modal h2{
    font-family:'Archivo Black', sans-serif;
    font-size:18px;
    margin:0 0 14px;
    color:var(--green-dark);
    text-transform:lowercase;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .field input{width:100%;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}

  .config-banner{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:16px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .config-banner input{width:100%; margin-top:8px;}
  .config-banner .btn{margin-top:10px;}

  .toast{
    position:fixed;
    bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    left:50%;
    max-width:calc(100% - 32px);
    transform:translateX(-50%) translateY(120%);
    opacity:0;
    pointer-events:none;
    background:var(--toast-bg);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:600;
    transition:transform .25s ease, opacity .25s ease;
    z-index:50;
  }
  .toast.show{transform:translateX(-50%) translateY(0); opacity:1; pointer-events:auto;}
  .toastUndo{
    background:none;
    border:none;
    color:#fff;
    text-decoration:underline;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    padding:0;
    margin-left:14px;
  }
  .toast.error{background:var(--red);}

  ::selection{background:var(--green); color:#fff;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>¿qué hay en casa?</h1>
    <span class="tag" id="statusTag">offline</span>
    <button class="tag" id="btnRefresh" title="Refrescar" style="cursor:pointer">⟳</button>
  </div>
  <div class="sub">y, ¿qué falta?</div>
</header>

<nav class="tabs" id="tabs">
  <button class="active" data-view="stock">Stock</button>
  <button data-view="lista">Lista de compras</button>
</nav>

<div class="wrap">

  <section class="view active" id="view-stock">
    <div class="toolbar">
      <input type="text" id="stockSearch" placeholder="Buscar producto...">
      <select id="catFilter"><option value="">Todas las categorías</option></select>
      <button class="btn" id="btnAddProduct">+ Producto</button>
    </div>
    <div id="stockList"></div>
  </section>

  <section class="view" id="view-lista">
    <div class="toolbar">
      <input type="text" id="listaSearch" placeholder="Buscar producto...">
      <select id="catFilterLista"><option value="">Todas las categorías</option></select>
    </div>
    <div class="toolbar">
      <button class="btn secondary" id="btnSuggest">Generar sugerencias</button>
      <button class="btn secondary" id="btnShare">Compartir</button>
      <button class="btn ghost" id="btnClearDone">Vaciar comprados</button>
      <button class="btn" id="btnAddManual">+ Item</button>
    </div>
    <div id="listaList"></div>
  </section>

</div>

<dialog id="dlgProduct">
  <div class="modal">
    <h2>nuevo producto</h2>
    <div class="field">
      <label>Nombre</label>
      <input type="text" id="p_nombre" placeholder="Ej: Aceite de girasol" list="productoDatalist">
    </div>
    <div class="field">
      <label>Categoría</label>
      <input type="text" id="p_categoria" placeholder="Ej: Almacén" list="catDatalist">
      <datalist id="catDatalist"></datalist>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Cantidad actual</label>
        <input type="number" id="p_cantidad" value="1" min="0">
      </div>
      <div class="field">
        <label>Unidad</label>
        <input type="text" id="p_unidad" value="u" placeholder="u, kg, L...">
      </div>
    </div>
    <div class="field">
      <label>Stock mínimo (aviso de reposición)</label>
      <input type="number" id="p_min" value="1" min="0">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" id="p_cancel">Cancelar</button>
      <button class="btn" id="p_save">Guardar</button>
    </div>
  </div>
</dialog>

<dialog id="dlgManual">
  <div class="modal">
    <h2>agregar a la lista</h2>
    <div class="field">
      <label>Producto</label>
      <input type="text" id="m_nombre" placeholder="Ej: Servilletas" list="productoDatalist">
    </div>
    <div class="field">
      <label>Categoría</label>
      <input type="text" id="m_categoria" placeholder="Ej: Limpieza" list="catDatalist2">
      <datalist id="catDatalist2"></datalist>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Cantidad</label>
        <input type="number" id="m_cantidad" value="1" min="1">
      </div>
      <div class="field">
        <label>Precio (opcional)</label>
        <input type="number" id="m_precio" placeholder="0" min="0" step="0.01">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" id="m_cancel">Cancelar</button>
      <button class="btn" id="m_save">Agregar</button>
    </div>
  </div>
</dialog>

<datalist id="productoDatalist"></datalist>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" class="toastUndo" style="display:none">Deshacer</button></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw9eyKbEYttKnGiYGckf2xTMX_kOt_fH-P4R5Q3cMznrQfke9lvm8eJKPemMOTS6efk/exec';
const API_TOKEN = '91e25726f3efbc14634750657c43dcddc2d41d3786be2ee1';
let STATE = { stock: [], lista: [] };
let editingId = null;

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function toast(msg, isError, undoFn){
  const t = $('#toast');
  $('#toastMsg').textContent = msg;
  const undoBtn = $('#toastUndo');
  if(undoFn){
    undoBtn.style.display = 'inline';
    undoBtn.onclick = () => { clearTimeout(t._timer); t.classList.remove('show'); undoFn(); };
  } else {
    undoBtn.style.display = 'none';
    undoBtn.onclick = null;
  }
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), undoFn ? 5000 : 2600);
}

function setStatus(ok){
  const tag = $('#statusTag');
  tag.textContent = ok ? 'conectado' : 'offline';
  tag.style.color = ok ? 'var(--green-dark)' : 'var(--red)';
  tag.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
}

// Reintenta ante caídas de red o cold-starts lentos de Apps Script (no ante
// errores de la aplicación, esos ya vinieron con respuesta y no van a cambiar).
async function fetchWithRetry(url, options, retries = 2, timeoutMs = 12000, backoffMs = 1000){
  for(let attempt = 0; attempt <= retries; attempt++){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try{
      const res = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(timer);
      return res;
    }catch(err){
      clearTimeout(timer);
      if(attempt === retries) throw err;
      await new Promise(r => setTimeout(r, backoffMs * (attempt + 1)));
    }
  }
}

async function api(action, payload){
  if(!API_URL){ toast('Configurá la URL de la API primero', true); throw new Error('no api url'); }
  try{
    const res = await fetchWithRetry(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
      body: JSON.stringify({ action, token: API_TOKEN, payload: payload || {} })
    });
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Error desconocido');
    setStatus(true);
    return json.data;
  }catch(err){
    setStatus(false);
    toast('Error: ' + err.message, true);
    throw err;
  }
}

async function loadData(){
  if(!API_URL) return;
  try{
    const res = await fetchWithRetry(API_URL + '?token=' + encodeURIComponent(API_TOKEN), { method:'GET' });
    const json = await res.json();
    if(!json.ok) throw new Error(json.error);
    STATE = json.data;
    setStatus(true);
    renderAll();
  }catch(err){
    setStatus(false);
    toast('No se pudo conectar: ' + err.message, true);
  }
}

// ---------- Loading state ----------
function setBusy(el, busy){
  if(!el) return;
  if(busy){
    el._label = el.textContent;
    el.disabled = true;
    el.dataset.busy = '1';
    el.textContent = '…';
  } else {
    el.disabled = false;
    delete el.dataset.busy;
    if(el._label !== undefined) el.textContent = el._label;
  }
}

function categorias(){
  const cats = new Set();
  STATE.stock.forEach(p => cats.add(p.categoria || 'Sin categoría'));
  return Array.from(cats).sort();
}

function categoriasLista(){
  const cats = new Set();
  STATE.lista.forEach(i => cats.add(i.categoria || 'Sin categoría'));
  return Array.from(cats).sort();
}

// Evita categorías duplicadas por variaciones de tipeo/mayúsculas
// (ej: "Almacén" vs "almacen "): si ya existe una igual salvo casing/espacios,
// reutiliza esa exacta en vez de crear una nueva.
function normalizeCategoria(input){
  const trimmed = (input || '').trim().replace(/\s+/g, ' ');
  if(!trimmed) return 'Sin categoría';
  const todas = new Set();
  STATE.stock.forEach(p => todas.add(p.categoria || 'Sin categoría'));
  STATE.lista.forEach(i => todas.add(i.categoria || 'Sin categoría'));
  const existing = Array.from(todas).find(c => c.toLowerCase() === trimmed.toLowerCase());
  return existing || trimmed;
}

function productosStock(){
  const nombres = new Set();
  STATE.stock.forEach(p => nombres.add(p.producto));
  return Array.from(nombres).sort();
}

// Si ya existe un producto en Stock con el mismo nombre salvo casing/espacios,
// reutiliza ese nombre exacto. Así "leche" o "Leche  " matchean con "Leche" y
// el chequeo de la Lista de compras puede sincronizar el stock correctamente.
function normalizeProducto(input){
  const trimmed = (input || '').trim().replace(/\s+/g, ' ');
  if(!trimmed) return trimmed;
  const existing = productosStock().find(p => p.toLowerCase() === trimmed.toLowerCase());
  return existing || trimmed;
}

function renderCatOptions(){
  const cats = categorias();
  const sel = $('#catFilter');
  const current = sel.value;
  sel.innerHTML = '<option value="">Todas las categorías</option>' +
    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  sel.value = current;

  const catsLista = categoriasLista();
  const selLista = $('#catFilterLista');
  const currentLista = selLista.value;
  selLista.innerHTML = '<option value="">Todas las categorías</option>' +
    catsLista.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  selLista.value = currentLista;

  ['#catDatalist', '#catDatalist2'].forEach(id => {
    $(id).innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');
  });

  $('#productoDatalist').innerHTML = productosStock().map(p => `<option value="${escapeHtml(p)}">`).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function groupBy(items, key){
  const map = {};
  items.forEach(i => {
    const k = i[key] || 'Sin categoría';
    if(!map[k]) map[k] = [];
    map[k].push(i);
  });
  return map;
}

function renderStock(){
  const filter = $('#catFilter').value;
  const search = $('#stockSearch').value.trim().toLowerCase();
  const items = STATE.stock
    .filter(p => !filter || p.categoria === filter)
    .filter(p => !search || p.producto.toLowerCase().includes(search))
    .sort((a,b) => (a.categoria||'').localeCompare(b.categoria||'') || a.producto.localeCompare(b.producto));

  const container = $('#stockList');
  if(items.length === 0){
    container.innerHTML = STATE.stock.length === 0
      ? `<div class="receipt"><div class="empty"><span class="icon">🗃️</span>No hay productos cargados todavía.<br>Tocá "+ Producto" para empezar.</div></div>`
      : `<div class="receipt"><div class="empty"><span class="icon">🔍</span>Ningún producto coincide con la búsqueda.</div></div>`;
    return;
  }

  const grouped = groupBy(items, 'categoria');
  let html = '<div class="receipt">';
  Object.keys(grouped).sort().forEach(cat => {
    html += `<div class="cat-heading">${escapeHtml(cat)}</div>`;
    grouped[cat].forEach(p => {
      const low = Number(p.cantidad) <= Number(p.stockMinimo);
      html += `
        <div class="row ${low ? 'low' : ''}" data-id="${p.id}">
          <div class="name" data-act="editProduct" data-id="${p.id}" style="cursor:pointer">${escapeHtml(p.producto)}<span class="cat-pill">min: ${p.stockMinimo} ${escapeHtml(p.unidad)}</span></div>
          <div class="qty-controls">
            <button data-act="dec" data-id="${p.id}">−</button>
            <span class="qty-val">${p.cantidad} ${escapeHtml(p.unidad)}</span>
            <button data-act="inc" data-id="${p.id}">+</button>
          </div>
          <button class="del" data-act="delProduct" data-id="${p.id}">✕</button>
        </div>`;
    });
  });
  html += '</div>';
  container.innerHTML = html;
}

function renderLista(){
  const container = $('#listaList');
  const search = $('#listaSearch').value.trim().toLowerCase();
  const filter = $('#catFilterLista').value;
  const filtered = STATE.lista
    .filter(i => !filter || i.categoria === filter)
    .filter(i => !search || i.producto.toLowerCase().includes(search));
  const pendientes = filtered.filter(i => !i.comprado);
  const comprados = filtered.filter(i => i.comprado);

  if(STATE.lista.length === 0){
    container.innerHTML = `<div class="receipt tear"><div class="empty"><span class="icon">🧾</span>Tu lista está vacía.<br>Agregá algo manual o generá sugerencias desde el stock.</div></div>`;
    return;
  }
  if(filtered.length === 0){
    container.innerHTML = `<div class="receipt tear"><div class="empty"><span class="icon">🔍</span>Ningún item coincide con la búsqueda.</div></div>`;
    return;
  }

  let html = '<div class="receipt tear">';
  const grouped = groupBy(pendientes, 'categoria');
  Object.keys(grouped).sort().forEach(cat => {
    html += `<div class="cat-heading">${escapeHtml(cat)}</div>`;
    grouped[cat].forEach(i => {
      html += listRow(i, false);
    });
  });
  if(comprados.length){
    html += `<div class="cat-heading">Ya comprados</div>`;
    comprados.forEach(i => html += listRow(i, true));
  }
  html += '</div>';
  container.innerHTML = html;
}

function listRow(i, done){
  return `
    <div class="row check-row ${done ? 'done' : ''}" data-id="${i.id}">
      <input type="checkbox" data-act="toggle" data-id="${i.id}" ${done ? 'checked' : ''}>
      <div class="name" data-act="editLista" data-id="${i.id}" style="cursor:pointer">${escapeHtml(i.producto)} ${i.origen === 'auto' ? '<span class="origin-auto">auto</span>' : ''}<span class="cat-pill">cant: ${i.cantidad}${i.precio ? ` · $${i.precio}` : ''}</span></div>
      <button class="del" data-act="delLista" data-id="${i.id}">✕</button>
    </div>`;
}

function renderAll(){
  renderCatOptions();
  renderStock();
  renderLista();
}

// ---------- Tabs ----------
$$('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('nav.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    $$('.view').forEach(v => v.classList.remove('active'));
    $('#view-' + btn.dataset.view).classList.add('active');
  });
});

$('#catFilter').addEventListener('change', renderStock);
$('#stockSearch').addEventListener('input', renderStock);
$('#listaSearch').addEventListener('input', renderLista);
$('#catFilterLista').addEventListener('change', renderLista);

// ---------- Stock actions ----------
$('#stockList').addEventListener('click', async (e) => {
  const target = e.target.closest('[data-act]');
  if(!target) return;
  const id = target.dataset.id;
  if(target.dataset.act === 'editProduct'){
    openProductDialog(STATE.stock.find(p => p.id === id));
  } else if(target.dataset.act === 'inc'){
    setBusy(target, true);
    STATE = await api('adjustStock', { id, delta: 1 });
    renderAll();
  } else if(target.dataset.act === 'dec'){
    setBusy(target, true);
    STATE = await api('adjustStock', { id, delta: -1 });
    renderAll();
  } else if(target.dataset.act === 'delProduct'){
    const product = STATE.stock.find(p => p.id === id);
    setBusy(target, true);
    STATE = await api('deleteProduct', { id });
    renderAll();
    toast(`"${product.producto}" eliminado`, false, async () => {
      STATE = await api('addProduct', {
        producto: product.producto,
        categoria: product.categoria,
        cantidad: product.cantidad,
        unidad: product.unidad,
        stockMinimo: product.stockMinimo
      });
      renderAll();
      toast('Producto restaurado');
    });
  }
});

function openProductDialog(product){
  editingId = product ? product.id : null;
  $('#dlgProduct h2').textContent = product ? 'editar producto' : 'nuevo producto';
  $('#p_nombre').value = product ? product.producto : '';
  $('#p_categoria').value = product ? product.categoria : '';
  $('#p_cantidad').value = product ? product.cantidad : 1;
  $('#p_unidad').value = product ? product.unidad : 'u';
  $('#p_min').value = product ? product.stockMinimo : 1;
  $('#dlgProduct').showModal();
}

$('#btnAddProduct').addEventListener('click', () => openProductDialog(null));
$('#p_cancel').addEventListener('click', () => $('#dlgProduct').close());
$('#p_save').addEventListener('click', async () => {
  const nombre = normalizeProducto($('#p_nombre').value);
  if(!nombre){ toast('Poné un nombre', true); return; }
  const payload = {
    producto: nombre,
    categoria: normalizeCategoria($('#p_categoria').value),
    cantidad: $('#p_cantidad').value,
    unidad: $('#p_unidad').value.trim() || 'u',
    stockMinimo: $('#p_min').value
  };
  setBusy($('#p_save'), true);
  try{
    if(editingId){
      payload.id = editingId;
      STATE = await api('updateProduct', payload);
      toast('Producto actualizado');
    } else {
      STATE = await api('addProduct', payload);
      toast('Producto agregado');
    }
    renderAll();
    $('#dlgProduct').close();
  } finally {
    setBusy($('#p_save'), false);
  }
});

// ---------- Lista actions ----------
$('#listaList').addEventListener('click', async (e) => {
  const target = e.target.closest('[data-act]');
  if(!target) return;
  const id = target.dataset.id;
  if(!id) return;
  if(target.dataset.act === 'editLista'){
    openListaDialog(STATE.lista.find(i => i.id === id));
  } else if(target.dataset.act === 'toggle'){
    const item = STATE.lista.find(i => i.id === id);
    const seVaAComprar = !item.comprado;
    setBusy(target, true);
    STATE = await api('toggleComprado', { id });
    const match = STATE.stock.find(p => p.producto.trim().toLowerCase() === item.producto.trim().toLowerCase());
    if(match){
      const delta = seVaAComprar ? Number(item.cantidad) : -Number(item.cantidad);
      STATE = await api('adjustStock', { id: match.id, delta });
      toast(seVaAComprar
        ? `Sumado a stock: ${match.producto} (+${item.cantidad})`
        : `Restado de stock: ${match.producto} (-${item.cantidad})`);
    }
    renderAll();
  } else if(target.dataset.act === 'delLista'){
    const item = STATE.lista.find(i => i.id === id);
    setBusy(target, true);
    STATE = await api('deleteFromShoppingList', { id });
    renderAll();
    toast(`"${item.producto}" eliminado`, false, async () => {
      STATE = await api('addToShoppingList', {
        producto: item.producto,
        categoria: item.categoria,
        cantidad: item.cantidad,
        origen: item.origen,
        precio: item.precio || ''
      });
      renderAll();
      toast('Item restaurado');
    });
  }
});

function textoListaCompartible(){
  const pendientes = STATE.lista.filter(i => !i.comprado);
  let texto = '¿Qué hay en casa? — Lista de compras\n';
  const grouped = groupBy(pendientes, 'categoria');
  Object.keys(grouped).sort().forEach(cat => {
    texto += `\n${cat.toUpperCase()}\n`;
    grouped[cat].forEach(i => {
      texto += `- ${i.producto} (x${i.cantidad})\n`;
    });
  });
  return texto.trim();
}

$('#btnShare').addEventListener('click', async () => {
  const pendientes = STATE.lista.filter(i => !i.comprado);
  if(pendientes.length === 0){ toast('No hay items pendientes para compartir', true); return; }
  const texto = textoListaCompartible();
  if(navigator.share){
    try{
      await navigator.share({ text: texto });
    }catch(err){
      if(err.name !== 'AbortError') toast('No se pudo compartir', true);
    }
  } else {
    try{
      await navigator.clipboard.writeText(texto);
      toast('Lista copiada al portapapeles');
    }catch(err){
      toast('No se pudo copiar la lista', true);
    }
  }
});

$('#btnSuggest').addEventListener('click', async () => {
  const btn = $('#btnSuggest');
  setBusy(btn, true);
  try{
    STATE = await api('generateSuggestions');
    renderAll();
    toast('Sugerencias generadas');
  } finally {
    setBusy(btn, false);
  }
});

$('#btnClearDone').addEventListener('click', async () => {
  const btn = $('#btnClearDone');
  const comprados = STATE.lista.filter(i => i.comprado);
  if(comprados.length === 0) return;
  const totalGastado = comprados.reduce((sum, i) => sum + (Number(i.precio) || 0) * Number(i.cantidad), 0);
  setBusy(btn, true);
  try{
    STATE = await api('clearComprados');
    renderAll();
    const totalTxt = totalGastado > 0 ? ` — gastaste $${totalGastado.toFixed(2)}` : '';
    toast(`${comprados.length} item(s) borrados${totalTxt}`, false, async () => {
      for(const item of comprados){
        STATE = await api('addToShoppingList', {
          producto: item.producto,
          categoria: item.categoria,
          cantidad: item.cantidad,
          origen: item.origen,
          precio: item.precio || ''
        });
        const nuevo = STATE.lista.find(i => i.producto === item.producto && i.categoria === item.categoria && !i.comprado);
        if(nuevo) STATE = await api('toggleComprado', { id: nuevo.id });
      }
      renderAll();
      toast('Lista restaurada');
    });
  } finally {
    setBusy(btn, false);
  }
});

let editingListId = null;

function openListaDialog(item){
  editingListId = item ? item.id : null;
  $('#dlgManual h2').textContent = item ? 'editar item' : 'agregar a la lista';
  $('#m_save').textContent = item ? 'Guardar' : 'Agregar';
  $('#m_nombre').value = item ? item.producto : '';
  $('#m_categoria').value = item ? item.categoria : '';
  $('#m_cantidad').value = item ? item.cantidad : 1;
  $('#m_precio').value = item && item.precio ? item.precio : '';
  $('#dlgManual').showModal();
}

$('#btnAddManual').addEventListener('click', () => openListaDialog(null));
$('#m_cancel').addEventListener('click', () => $('#dlgManual').close());
$('#m_save').addEventListener('click', async () => {
  const nombre = normalizeProducto($('#m_nombre').value);
  if(!nombre){ toast('Poné un nombre', true); return; }
  const payload = {
    producto: nombre,
    categoria: normalizeCategoria($('#m_categoria').value),
    cantidad: $('#m_cantidad').value,
    precio: $('#m_precio').value || ''
  };
  setBusy($('#m_save'), true);
  try{
    if(editingListId){
      payload.id = editingListId;
      STATE = await api('updateShoppingListItem', payload);
      toast('Item actualizado');
    } else {
      payload.origen = 'manual';
      STATE = await api('addToShoppingList', payload);
      toast('Agregado a la lista');
    }
    renderAll();
    $('#dlgManual').close();
  } finally {
    setBusy($('#m_save'), false);
  }
});

$('#btnRefresh').addEventListener('click', async () => {
  const btn = $('#btnRefresh');
  btn.disabled = true;
  btn.classList.add('spin');
  try{
    await loadData();
  } finally {
    btn.disabled = false;
    btn.classList.remove('spin');
  }
});

// ---------- Init ----------
loadData();
</script>
</body>
</html>
